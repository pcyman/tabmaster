<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TabMaster</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <h1>TabMaster</h1>

      <button id="copy-tabs-button" type="button" class="primary-button">
        Copy current window tab URLs
      </button>

      <label for="url-input" class="input-label">Paste URLs, one per line</label>
      <textarea
        id="url-input"
        rows="10"
        spellcheck="false"
        placeholder="example.com&#10;https://developer.mozilla.org&#10;http://localhost:3000"
      ></textarea>

      <button id="open-urls-button" type="button" class="primary-button">
        Open URLs
      </button>

      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
